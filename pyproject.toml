[project]
name = "fastapi-starter"
version = "0.1.0"
description = "A production-ready FastAPI starter template"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2.0",
  "asyncpg>=0.29,<1.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "pydantic[email]>=2.6,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "PyJWT>=2.9,<3.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
  "python-multipart>=0.0.33",
]
[dependency-groups]
dev = ["pytest>=8.3,<9.0", "pytest-asyncio>=0.24,<1.0", "ruff>=0.8,<1.0"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["fastapi_starter"]
